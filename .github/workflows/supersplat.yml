name: Build SuperSplat image

# Handmatig starten, of elke maandag automatisch checken op een nieuwe release.
# Bestaat het image voor de nieuwste release al, dan wordt er niets gebouwd.
on:
  workflow_dispatch:
    inputs:
      force:
        description: "Opnieuw bouwen, ook als deze versie al bestaat"
        type: boolean
        default: false
  schedule:
    - cron: "37 4 * * 1"

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Nieuwste SuperSplat-release en image-naam bepalen
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=$(gh release view --repo playcanvas/supersplat --json tagName -q .tagName)
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          IMAGE="ghcr.io/${OWNER}/supersplat"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"
          echo "Nieuwste release: ${TAG}"

      - name: Log in bij GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Bestaat deze versie al?
        id: check
        run: |
          if [ "${{ inputs.force }}" = "true" ]; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
          elif docker manifest inspect "${{ steps.version.outputs.image }}:${{ steps.version.outputs.tag }}" > /dev/null 2>&1; then
            echo "Image voor ${{ steps.version.outputs.tag }} bestaat al, niets te doen."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Code ophalen
        if: steps.check.outputs.skip == 'false'
        uses: actions/checkout@v4

      - name: Docker Buildx
        if: steps.check.outputs.skip == 'false'
        uses: docker/setup-buildx-action@v3

      - name: Bouwen en pushen
        if: steps.check.outputs.skip == 'false'
        uses: docker/build-push-action@v6
        with:
          context: supersplat
          push: true
          build-args: |
            SUPERSPLAT_REF=${{ steps.version.outputs.tag }}
          tags: |
            ${{ steps.version.outputs.image }}:${{ steps.version.outputs.tag }}
            ${{ steps.version.outputs.image }}:latest
