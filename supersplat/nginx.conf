server {
    listen 80;
    server_name _;

    sendfile on;
    tcp_nopush on;

    # SuperSplat zelf
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # Splats-map (alleen-lezen gemount), te openen met ?load=/splats/<pad>
    location /splats/ {
        alias /splats/;
        autoindex off;
        default_type application/octet-stream;
        types { }
    }
}
