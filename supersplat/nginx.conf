server {
    listen 443 ssl;
    http2 on;
    server_name _;

    # Self-signed certificaat, bij de eerste start aangemaakt door
    # /docker-entrypoint.d/10-selfsigned-cert.sh
    ssl_certificate     /certs/cert.pem;
    ssl_certificate_key /certs/key.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    sendfile on;
    tcp_nopush on;

    # SuperSplat zelf
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # Splats-map (alleen-lezen gemount), te openen met ?load=/splats/<pad>
    location /splats/ {
        alias /splats/;
        autoindex off;
        default_type application/octet-stream;
        types { }
    }
}
